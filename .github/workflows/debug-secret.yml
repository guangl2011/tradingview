name: Secret debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret/variable presence (booleans only)
        run: |
          echo "repository secret SLACK_WEBHOOK_URL present: ${{ secrets.SLACK_WEBHOOK_URL != '' }}"
          echo "repository variable SLACK_WEBHOOK_URL present: ${{ vars.SLACK_WEBHOOK_URL != '' }}"
          echo "org secret present: ${{ secrets.ORG_SLACK_WEBHOOK_URL != '' }}"
