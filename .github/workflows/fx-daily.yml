name: FX daily report

# Runs weekdays 21:00 UTC (after New York close and the ECB reference fixing).
#
# OWNER SETUP: this workflow needs SLACK_WEBHOOK_URL — a Slack incoming-webhook
# URL — added as a repository secret (Settings → Secrets and variables →
# Actions → New repository secret). It is read from the secrets store; it is
# never hardcoded here. Without it the pipeline still archives the CSV but
# exits non-zero with a clear error.

on:
  schedule:
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fx-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run FX daily pipeline
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m pipelines.fx_daily

      # `if: always()` so a failed Slack send still preserves the day's snapshot.
      - name: Commit daily CSV snapshot
        if: always()
        run: |
          git config user.name "Obvious"
          git config user.email "obvious@obvious.ai"
          git add data/fx
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "chore: FX daily snapshot $(date -u +%F)"
            git push
          fi
